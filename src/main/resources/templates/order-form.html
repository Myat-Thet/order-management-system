<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf">
<head th:replace="~{masterLayout :: head('Order Form')}">
</head>
<body>
	<div th:replace="~{masterLayout :: header}"></div>
	<main class="container">
		<div class="form-card">
			<h1 th:text="${order.id == null} ? 'Add Order' : 'Update Order'"></h1>
			<form th:object="${order}"
				th:action="${order.id == null} ? @{/order/save} : @{/order/update/{id}(id =${order.id})}"
				method="post">
				<div class="form-group">
					<div class="form-group">
						<label>Order Date</label> <input type="datetime-local"
							th:field="*{orderDate}" placeholder="Enter order Date" required />
					</div>
					<div class="form-group">
						<label>Quantity</label> <input type="text" th:field="*{quantity}"
							placeholder="Enter order quantity" required />
					</div>					
				</div>

				<!-- 	Customer -->
				<div class="form-group">
					<div class="form-group">
						<label>Customer</label> <select name="customerId" required>
							<option value="">Select Customer</option>
							<option th:each="customer : ${customers}"
								th:value="${customer.id}" th:text="${customer.name}"></option>
						</select>
					</div>
				</div>
				<!-- 	Product -->
				<div class="form-group">
					<div class="form-group">
						<label>Product</label> <select name="productId" required>
							<option value="">Select Product</option>
							<option th:each="product : ${products}" th:value="${product.id}"
								th:text="${product.name}"></option>
						</select>
					</div>
				</div>
				<!-- 	Button -->
				<div class="button-group">
					<button type="submit" class="btn btn-primary"
						th:text="${order.id == null}? 'Save Order ' : 'Update Order' "></button>
					<a th:href="@{/order/view}" class="btn btn-secondary"> Cancel </a>
				</div>
			</form>
		</div>
	</main>
	<!-- 	Footer -->
	<div th:replace="~{masterLayout :: footer}"></div>
</body>
</html>
