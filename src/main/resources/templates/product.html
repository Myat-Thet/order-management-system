<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{masterLayout :: head('Product List')}">
</head>

<body>

    <div th:replace="~{masterLayout :: header}"></div>

    <main class="container">

        <!-- ====== Page Header ====== -->
        <div class="page-header">

            <div>
                <h1>Product List</h1>
                <p>Manage your Products</p>
            </div>

            <a th:href="@{/product}" class="btn btn-primary">
                Add Product
            </a>

        </div>

        <!-- ====== Product Table ====== -->
        <div>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Product Price</th>
                        <th>Product Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <!-- ====== Product Rows ====== -->
                    <tr th:each="product : ${products}">

                        <td th:text="${product.id}"></td>

                        <td th:text="${product.name}"></td>

                        <td th:text="${product.price}"></td>

                        <td th:text="${product.stock}"></td>

                        <td class="actions">

                            <!-- Edit -->
                            <a th:href="@{/product/update/{id}(id=${product.id})}"
                               class="btn btn-edit">
                                Edit
                            </a>

                            <!-- Delete -->
                            <form th:action="@{/product/delete/{id}(id=${product.id})}"
                                  method="post"
                                  class="delete-form">

                                <button type="submit"
                                        class="btn btn-delete"
                                        onclick="return confirm('Are you sure you want to delete this product?')">
                                    Delete
                                </button>

                            </form>

                        </td>

                    </tr>

                    <!-- ====== Empty ====== -->
                    <tr th:if="${#lists.isEmpty(products)}">

                        <td colspan="7" class="empty-message">
                            No products found.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <!-- ====== Total Product ====== -->
        <div>

            <a th:href="@{/product/view}"  class="btn btn-view">
                Product Total:
                <span th:text="${productCount}">0</span>
            </a>

        </div>

    </main>

    <!-- ====== Footer ====== -->
    <div th:replace="~{masterLayout :: footer}"></div>

</body>

</html>
