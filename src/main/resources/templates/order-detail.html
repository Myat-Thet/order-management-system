<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{masterLayout :: head('Order Detail')}">
</head>
<body>
	<!-- Header -->
	<div th:replace="~{masterLayout :: header}"></div>
	<main class="container">
		<div class="detail-card">
			<div class="detail-header">
				<div>
					<h1>Order Details</h1>
					<p>Order Information</p>
				</div>
			</div>
			<!-- 			Details -->
			<div class="detail-content">
				<!-- ID -->
				<div class="detail-item">
					<span class="detail-label"> Order ID </span> <span
						class="detail-value" th:text="${order.get().id}"></span>
				</div>

				<!-- OrderDate -->
				<div class="detail-item">
					<span class="detail-label"> Order Date</span> <span
						class="detail-value"
						 th:text="${#temporals.format(order.get().orderDate, 'dd-MM-yyyy HH:mm')}">
					</span>
				</div>

				<!-- 	Quantity -->
				<div class="detail-item">
					<span class="detail-label">Quantity</span> <span
						class="detail-value" th:text="${order.get().quantity}"></span>
				</div>
				<!-- 	Total Amount -->
				<div class="detail-item">
					<span class="detail-label">Total Amount</span> <span
						class="detail-value" th:text="${order.get().totalAmount}"></span>
				</div>
				<!-- 	Customer -->
				<div class="detail-item">
					<span class="detail-label">Customer</span> <span
						class="detail-value" th:text="${order.get().customer.getName()}"></span>
				</div>
				<!-- 	Product  -->
				<div class="detail-item">
					<span class="detail-label">Product</span> <span
						class="detail-value" th:text="${order.get().product.getName()}"></span>
				</div>
			</div>
			<!-- 		Buttons -->
			<div class="button-group">
				<a th:href="@{/order/view}"
					class="btn btn-secondary">Back</a>
			</div>
		</div>
	</main>
	<!-- 	Footer -->
	<div th:replace="~{masterLayout :: footer}"></div>
</body>
</html>
