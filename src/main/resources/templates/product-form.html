<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf">
<head th:replace="~{masterLayout :: head('Product Form')}">
</head>
<body>
	<div th:replace="~{masterLayout :: header}"></div>

	<main class="container">
		<div class="form-card">
			<h1
				th:text="${product.id == null} ? 'Add Product' : 'Update Product'"></h1>
			<form th:object="${product}"
				th:action="${product.id == null} ? @{/product/save} : @{/product/update/{id} (id=${product.id})}"
				method="post">
				<div class="form-group">
					<label>Product Name</label> <input type="text" th:field="*{name}"
						placeholder="Enter product name" required />
				</div>
				<div class="form-group">
					<label>Product Price</label> <input type="text" th:field="*{price}"
						placeholder="Enter product name" required />
				</div>
				<div class="form-group">
					<label>Product Stock</label> <input type="text" th:field="*{stock}"
						placeholder="Enter product name" required />
				</div>
				
				<div class="button-group">
					<button type="submit" class="btn btn-primary"
						th:text="${product.id == null} ? 'Save Product' : 'Update Product'"></button>
					<a th:href="@{/product/view}" class="btn btn-secondary">Can</a>
				</div>
			</form>
		</div>
	</main>
	<div th:replace="~{masterLayout :: footer}"></div>

</body>
</html>
