<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{masterLayout :: head('Customer List')}">
</head>
<body>
	<div th:replace="~{masterLayout :: header}"></div>
	
	<main class="container">
		<div class="page-header">
			<div>
				<h1>Customer List</h1>
				<p>Manage your Customers</p>
			</div>
			<a th:href="@{/customer}" class="btn btn-primary">Add Customer</a>

		</div>
		<div class="table-card">
			<table>
				<thead>
					<tr>
					<th>ID</th>
					<th>Customer Name</th>
					<th>Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="customer : ${customers}">
						<td th:text="${customer.id}"></td>
						<td th:text="${customer.name}"></td>						
						<td class="actions">
							<a th:href="@{/customer/update/{id}(id=${customer.id})}" 
								class="btn btn-edit">Edit </a>
							<form th:action="@{/customer/delete/{id}(id=${customer.id})}" method="post" class="delete-form">
								<button type="submit" class="btn btn-delete" onclick="return confirm('Are you sure you want to delete this customer?')">Delete</button>
							</form>
						</td>					
					</tr>
					<tr th:if="${#lists.isEmpty(department)}">
						<td colspan="3 " class="empty-message">No Customer Found.</td>					
					</tr>
				</tbody>
			</table>
		</div>

	</main>
	
	<div th:replace="~{masterLayout :: footer}"></div>

</body>
</html>
